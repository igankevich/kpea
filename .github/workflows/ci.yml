---
name: CI
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
env:
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.92.0
  ARBTEST_BUDGET_MS: 10000
