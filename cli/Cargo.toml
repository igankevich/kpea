[package]
name = "kpea-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "CPIO archive reader/writer tool. Supports New ASCII and Old character formats. Fuzz-tested against GNU cpio."
keywords = ["cpio", "archive"]
categories = ["encoding", "filesystem", "command-line-utilities"]
include = ["**/*.rs", "Cargo.toml", "README.md", "cargo-fast-install.jsonl"]

[[bin]]
name = "kpea"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
cpio = { workspace = true }

[dev-dependencies]
arbtest = "0.3.2"
random-dir.workspace = true
similar-asserts = "1.7.0"
tempfile = "3.24.0"
test_bin = "0.5.0"
walkdir = "2.5.0"
